name: Publish chart

# Publishes the chart of a published GitHub Release (created by release-please
# when its release PR merges) to oci://ghcr.io/browserless/charts. Runs only on
# release events, from the release's commit. Tests and packaging run in separate
# read-only jobs; scripts/publish-chart.sh verifies the tag is on main and matches
# Chart.yaml and the release manifest, refuses to overwrite an existing
# version, and checks the pushed chart by pulling it back.
# The job then records a signed SLSA provenance attestation for the exact OCI
# manifest digest it pushed and verifies it against the registry. That digest
# and attestation identify the published chart: other repository writers can
# also push packages with GITHUB_TOKEN, so the registry alone is not proof.
# Keep `release` the only trigger, without workflow_dispatch: consumers trust
# attestations this workflow signs for refs/tags/browserless-v*.

on:
  release:
    types: [published]

concurrency:
  group: publish-chart
  cancel-in-progress: false

permissions: {}

jobs:
  # The chart tests need the scripts' npm dependency (yaml), so they run here,
  # without write access. The package and publish jobs install no npm packages.
  verify:
    # Release Please tags chart releases as <chart>-v<version>.
    if: contains(github.event.release.tag_name, '-v')
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # github.sha is the commit the release tag pointed to when the release
      # was published. All jobs check it out, so publish uses what this tested.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Only the locked runtime dependency (yaml), without install scripts.
      - run: npm ci --ignore-scripts --omit=dev
      - name: Install Helm (version from tools/go.mod)
        run: node scripts/install-tools.ts helm
      - name: Chart tests
        run: npm test
      - name: appVersion matches the default image tag
        run: node scripts/sync-app-version.ts --check

  # Isolate release bytes and the Helm binary from third-party npm test code.
  package:
    needs: verify
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      package-sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install Helm (version from tools/go.mod)
        run: node scripts/install-tools.ts helm
      - name: Package the tested chart without npm or publishing credentials
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          scripts/package-chart.sh "$TAG" "$RUNNER_TEMP/chart-package"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/chart-package/"*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: chart-package
          path: ${{ runner.temp }}/chart-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, package]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # Restrict this environment to browserless-v* tags; publication is automatic.
    environment: chart-release
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write
    steps:
      # The commit the verify job tested. publish-chart.sh refuses unless the
      # release tag still points to it.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Node runs only scripts that import nothing but Node built-ins.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install Helm (version from tools/go.mod)
        run: node scripts/install-tools.ts helm
      - uses: actions/download-artifact@v8.0.2
        with:
          name: chart-package
          path: ${{ runner.temp }}/chart-package
      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Helm, the attest action's registry push and gh attestation verify all
        # read the Docker credentials file, which the attest action only finds
        # at ~/.docker/config.json.
        run: |
          echo "HELM_REGISTRY_CONFIG=$HOME/.docker/config.json" >> "$GITHUB_ENV"
          HELM_REGISTRY_CONFIG="$HOME/.docker/config.json" \
            .bin/helm registry login ghcr.io --username "$ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
      - name: Publish
        id: publish
        env:
          TAG: ${{ github.event.release.tag_name }}
          PACKAGE_SHA256: ${{ needs.package.outputs.package-sha256 }}
          HELM: .bin/helm
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob dotglob
          archives=("$RUNNER_TEMP/chart-package/"*)
          [ "${#archives[@]}" -eq 1 ] && [ -f "${archives[0]}" ] || { echo 'expected exactly one chart archive' >&2; exit 1; }
          [[ $PACKAGE_SHA256 =~ ^[0-9a-f]{64}$ ]] || { echo 'missing package checksum' >&2; exit 1; }
          printf '%s  %s\n' "$PACKAGE_SHA256" "${archives[0]}" | sha256sum --check
          scripts/publish-chart.sh "$TAG" "${archives[0]}"
      - name: Attest provenance of the pushed manifest
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify the attestation for the published version
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.publish.outputs.name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh attestation verify "oci://$NAME:${TAG##*-v}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
            --source-ref "refs/tags/$TAG" --source-digest "$(git rev-parse HEAD)"
