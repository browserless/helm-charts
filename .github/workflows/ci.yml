name: CI

# Static checks, then the runtime suite (tests/e2e/kind.sh) on disposable kind
# clusters for both supported architectures and the oldest and newest qualified
# Kubernetes versions. Nothing here publishes anything or uses repository secrets.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # Also lets the Dependabot appVersion sync re-run CI on the commit it pushes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: tools/go.sum
      - name: Build the tools locked in tools/go.mod
        run: scripts/build-tools.sh
      - name: Lint workflows and scripts
        run: |
          .bin/actionlint
          shellcheck scripts/*.sh tests/e2e/*.sh
      - name: appVersion matches the default image tag
        run: scripts/sync-app-version.sh --check
      - name: Chart tests (schema, rendering, lint, package)
        run: ruby tests/chart_test.rb
        env:
          HELM: .bin/helm

  kind:
    needs: static
    name: kind (${{ matrix.runner }}, Kubernetes ${{ matrix.kubernetes }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        kubernetes: [oldest, latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: tools/go.sum
      - name: Build the tools locked in tools/go.mod
        run: scripts/build-tools.sh
      - name: Runtime tests on kind
        run: tests/e2e/kind.sh
        env:
          KIND_CONFIG: tests/kind/${{ matrix.kubernetes }}/cluster.yaml
          CLUSTER_NAME: browserless-e2e-${{ github.run_id }}
          E2E_OUT: ${{ runner.temp }}/e2e
          # Set this repository variable to the published chart (for example
          # oci://ghcr.io/browserless/charts/browserless) to also test upgrades
          # from the latest release. Unset, the upgrade-from-release check is skipped.
          UPGRADE_FROM: ${{ vars.E2E_UPGRADE_FROM }}
      - name: Upload the log and redacted diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.runner }}-${{ matrix.kubernetes }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14
          if-no-files-found: warn
