name: CI

# Static checks, then the runtime suite (tests/e2e/kind.sh) on disposable kind
# clusters: every Kubernetes minor version in tests/kind on both supported
# architectures. The `kind` job passes only if all of those passed, so branch
# protection requires `static` and `kind` whichever versions the matrix holds.
# Nothing here publishes anything or uses repository secrets.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # Also lets the Dependabot appVersion sync re-run CI on the commit it pushes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Install Helm and actionlint (versions from tools/go.mod)
        run: node scripts/install-tools.ts helm actionlint
      - name: Lint workflows and scripts
        run: |
          .bin/actionlint
          shellcheck scripts/*.sh tests/e2e/*.sh
      - name: Type-check
        run: npm run typecheck
      - name: Chart and script tests
        run: npm test

  e2e:
    needs: static
    name: e2e (${{ matrix.runner }}, Kubernetes ${{ matrix.kubernetes }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        # One entry per tests/kind/<minor> directory; the chart tests check this.
        kubernetes: ['1.35', '1.36', '1.37']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    outputs:
      # Every leg that runs reports the matrix size; the kind job checks each leg.
      legs: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --omit=dev
      - name: Install Helm and kind (versions from tools/go.mod)
        run: node scripts/install-tools.ts helm kind
      - name: Runtime tests on kind
        run: tests/e2e/kind.sh
        env:
          KIND_CONFIG: tests/kind/${{ matrix.kubernetes }}/cluster.yaml
          CLUSTER_NAME: browserless-e2e-${{ github.run_id }}
          E2E_OUT: ${{ runner.temp }}/e2e
          # Set this repository variable to the published chart (for example
          # oci://ghcr.io/browserless/charts/browserless) to also test upgrades
          # from the latest release. Unset, the upgrade-from-release check is skipped.
          UPGRADE_FROM: ${{ vars.E2E_UPGRADE_FROM }}
      - name: Upload the log and redacted diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.runner }}-${{ matrix.kubernetes }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14
          if-no-files-found: warn

  # The required runtime check. It always runs, and fails unless static and every
  # e2e job succeeded, so a failed, cancelled or skipped job cannot pass it.
  # GitHub can report a matrix as successful when a leg was cancelled before it
  # got a runner, so it also checks each leg of this run attempt.
  kind:
    if: always()
    needs: [static, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require static and every e2e job to succeed
        env:
          GH_TOKEN: ${{ github.token }}
          STATIC: ${{ needs.static.result }}
          E2E: ${{ needs.e2e.result }}
          LEGS: ${{ needs.e2e.outputs.legs }}
        run: |
          echo "static: $STATIC, e2e: $E2E, legs: $LEGS"
          [ "$STATIC" = success ] && [ "$E2E" = success ] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --paginate --jq '.jobs[] | select(.name | startswith("e2e (")) | "\(.conclusion) \(.name)"' > legs
          cat legs
          [ "$(grep -c '^success ' legs)" -eq "$LEGS" ] && ! grep -qv '^success ' legs
