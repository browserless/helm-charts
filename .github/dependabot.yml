version: 2
# Every version CI consumes is in a file Dependabot natively updates:
#   helm            the default image in values.yaml (and any chart
#                   dependencies); dependabot-app-version.yml then syncs appVersion
#   github-actions  workflow actions (commit SHAs with version comments)
#   gomod           Helm, kind and actionlint: tools/go.mod is only their version
#                   list; scripts/install-tools.ts downloads those release binaries
#   npm             the test and release scripts' dependencies (package-lock.json)
#   docker          the kindest/node images in tests/kind
# Not covered: the Node.js patch release (.nvmrc names the major version) and
# the runner's ShellCheck, jq, OpenSSL and Docker.
#
# Commit prefixes decide releases (see release-please-config.json): `build`
# changes what the chart deploys and cuts a patch release; `ci` does not.
updates:
  - package-ecosystem: helm
    directory: /charts/browserless
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      npm:
        patterns:
          - '*'
    # The Node.js types follow the major version in .nvmrc, which CI runs.
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  # One tested Kubernetes minor version per directory: patch and digest updates
  # only. Adding or removing a minor version is a deliberate change (README).
  - package-ecosystem: docker
    directories:
      - /tests/kind/*
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: kindest/node
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
